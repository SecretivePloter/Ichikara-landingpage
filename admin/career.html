<!DOCTYPE html>

<style>body{font-family:Inter,sans-serif}.font-noto{font-family:'Noto Serif JP',serif}.field{width:100%;border:1px solid #d1d5db;border-radius:.75rem;padding:.65rem .8rem;font-size:.875rem}.field:focus{outline:0;border-color:#b02d21;box-shadow:0 0 0 3px rgba(176,45,33,.1)}.tab{border-bottom:2px solid transparent;color:#6b7280}.tab.active{border-color:#b02d21;color:#021a38;font-weight:700}.entry{border:1px solid #e5e7eb;border-radius:1rem;padding:1rem}.entry:hover{border-color:#d1d5db}.status{width:auto;padding:.45rem .6rem;font-size:.75rem}</style></head>
<body class="min-h-screen bg-gray-50 text-gray-900"><div id="auth" class="fixed inset-0 z-50 grid place-items-center bg-[#021a38] p-5"><form id="login" class="w-full max-w-sm rounded-2xl bg-white p-9 shadow-2xl"><img src="../images/logo.png" alt="PT. Ichikara" class="mx-auto h-10 w-auto"><h1 class="mt-6 text-center text-xl font-bold text-[#021a38]">Admin Rekrutmen</h1><p class="mt-1 text-center text-xs text-gray-400">Akses file kandidat dan siswa</p><label class="mt-7 block text-xs font-bold text-gray-600">Email admin<input id="email" type="email" class="field mt-2" required autocomplete="email"></label><label class="mt-4 block text-xs font-bold text-gray-600">Kata sandi<input id="password" type="password" class="field mt-2" required autocomplete="current-password"></label><p id="login-error" class="mt-3 hidden text-xs text-red-600"></p><button class="mt-6 w-full rounded-xl bg-[#b02d21] py-3 text-sm font-bold text-white">Masuk</button></form></div>
<header class="bg-[#021a38] px-5 py-4 text-white md:px-8"><div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4"><div class="flex items-center gap-3"><img src="../images/logo.png" alt="PT. Ichikara" class="h-8 w-auto brightness-0 invert"><div><h1 class="font-bold">Admin Rekrutmen</h1><p class="text-xs text-white/50">CV interpreter dan kartu data siswa</p></div></div><div class="flex gap-2"><a href="career-settings.html" class="rounded-lg bg-white/10 px-3 py-2 text-xs font-bold hover:bg-white/20">Teks Career</a><a href="career-visual.html" class="rounded-lg bg-white/10 px-3 py-2 text-xs font-bold hover:bg-white/20">Visual Career</a><a href="index.html" class="rounded-lg bg-white/10 px-3 py-2 text-xs font-bold hover:bg-white/20">Dashboard utama</a></div></div></header>
<main class="mx-auto max-w-6xl px-5 py-9 md:px-8"><div id="notice" class="mb-6 hidden rounded-xl p-4 text-sm"></div><section class="rounded-2xl bg-white p-5 shadow-sm md:p-7"><div class="flex flex-wrap items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-[.14em] text-[#b02d21]">File privat</p><h2 class="mt-2 font-noto text-2xl font-bold text-[#021a38]">Data masuk</h2><p class="mt-2 text-sm text-gray-500">Unduh file hanya saat diperlukan. Setiap tautan unduh berlaku singkat.</p></div><button id="refresh" class="rounded-lg border border-gray-200 px-3 py-2 text-xs font-bold hover:bg-gray-50">Muat ulang</button></div><div class="mt-7 flex gap-6 border-b border-gray-200"><button class="tab active pb-3 text-sm" data-tab="interpreter">CV Interpreter <span id="interpreter-count" class="ml-1 text-xs text-gray-400">0</span></button><button class="tab pb-3 text-sm" data-tab="students">Kartu Siswa <span id="student-count" class="ml-1 text-xs text-gray-400">0</span></button></div><div id="interpreter-list" class="mt-6 space-y-3"><p class="text-sm text-gray-500">Memuat CV interpreter...</p></div><div id="student-list" class="mt-6 hidden space-y-3"><p class="text-sm text-gray-500">Memuat kartu siswa...</p></div></section></main>
<script>
(function(){'use strict';var URL='https://pfvlxlfykdabrwijqqxa.supabase.co',KEY='sb_publishable_C8EWE-TOsXBqzbH2aIjzcg_30Jx8Ove',sb=supabase.createClient(URL,KEY),notice=document.getElementById('notice');function esc(v){var d=document.createElement('div');d.textContent=v||'';return d.innerHTML}function msg(text,bad){notice.textContent=text;notice.className='mb-6 rounded-xl p-4 text-sm '+(bad?'bg-red-50 text-red-700':'bg-green-50 text-green-700');notice.classList.remove('hidden')}function fmt(date){return date?new Date(date).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-'}function statusOptions(current,items){return items.map(function(x){return '<option value="'+x[0]+'" '+(x[0]===current?'selected':'')+'>'+x[1]+'</option>'}).join('')}async function signedDownload(path,name){var result=await sb.storage.from('ichikara-web-recruitment').createSignedUrl(path,300,{download:name});if(result.error)throw result.error;var link=document.createElement('a');link.href=result.data.signedUrl;link.download=name;link.rel='noopener';document.body.appendChild(link);link.click();link.remove()}function bind(root,table){root.querySelectorAll('select[data-id]').forEach(function(select){select.onchange=async function(){var result=await sb.from(table).update({status:select.value}).eq('id',select.dataset.id);if(result.error)msg('Status belum tersimpan: '+result.error.message,true);else msg('Status diperbarui.')}});root.querySelectorAll('button[data-file]').forEach(function(button){button.onclick=async function(){button.disabled=true;try{await signedDownload(button.dataset.file,button.dataset.name)}catch(error){msg('File belum dapat diunduh: '+error.message,true)}finally{button.disabled=false}}})}function renderInterpreter(rows){var root=document.getElementById('interpreter-list');document.getElementById('interpreter-count').textContent=rows.length;if(!rows.length){root.innerHTML='<p class="text-sm text-gray-500">Belum ada CV interpreter masuk.</p>';return}root.innerHTML=rows.map(function(x){return '<article class="entry"><div class="flex flex-wrap items-start justify-between gap-4"><div><h3 class="font-bold text-[#021a38]">'+esc(x.full_name)+'</h3><p class="mt-1 text-sm text-gray-500">'+esc(x.email)+' · '+esc(x.phone)+'</p><p class="mt-2 text-xs text-gray-400">Masuk '+fmt(x.submitted_at)+'</p></div><select class="field status" data-id="'+x.id+'">'+statusOptions(x.status,[['submitted','Masuk'],['screening','Screening'],['interview','Wawancara'],['accepted','Diterima'],['rejected','Ditolak']])+'</select></div><div class="mt-4 flex flex-wrap gap-2"><button data-file="'+esc(x.cv_docx_path)+'" data-name="CV-Ichikara-'+esc(x.full_name)+'.docx" class="rounded-lg bg-[#021a38] px-3 py-2 text-xs font-bold text-white">Unduh CV</button><button data-file="'+esc(x.photo_path)+'" data-name="Foto-'+esc(x.full_name)+'.png" class="rounded-lg border border-gray-200 px-3 py-2 text-xs font-bold">Unduh foto</button></div></article>'}).join('');bind(root,'ichikara_web_applications')}function renderStudents(rows){var root=document.getElementById('student-list');document.getElementById('student-count').textContent=rows.length;if(!rows.length){root.innerHTML='<p class="text-sm text-gray-500">Belum ada kartu siswa masuk.</p>';return}root.innerHTML=rows.map(function(x){return '<article class="entry"><div class="flex flex-wrap items-start justify-between gap-4"><div><h3 class="font-bold text-[#021a38]">'+esc(x.full_name)+'</h3><p class="mt-1 text-sm text-gray-500">'+esc(x.email)+' · '+esc(x.phone)+'</p><p class="mt-1 text-xs text-gray-500">'+esc(x.school_or_company)+'</p><p class="mt-2 text-xs text-gray-400">Masuk '+fmt(x.submitted_at)+'</p></div><select class="field status" data-id="'+x.id+'">'+statusOptions(x.status,[['submitted','Masuk'],['contacted','Dihubungi'],['enrolled','Terdaftar'],['cancelled','Dibatalkan']])+'</select></div><div class="mt-4 flex flex-wrap gap-2"><button data-file="'+esc(x.card_xlsx_path)+'" data-name="Kartu-Data-Siswa-'+esc(x.full_name)+'.xlsx" class="rounded-lg bg-[#021a38] px-3 py-2 text-xs font-bold text-white">Unduh kartu Excel</button><button data-file="'+esc(x.photo_path)+'" data-name="Foto-'+esc(x.full_name)+'.png" class="rounded-lg border border-gray-200 px-3 py-2 text-xs font-bold">Unduh foto</button></div></article>'}).join('');bind(root,'ichikara_web_course_enrollments')}async function load(){var results=await Promise.all([sb.from('ichikara_web_applications').select('id,full_name,email,phone,status,submitted_at,photo_path,cv_docx_path').order('submitted_at',{ascending:false}).limit(100),sb.from('ichikara_web_course_enrollments').select('id,full_name,email,phone,school_or_company,status,submitted_at,photo_path,card_xlsx_path').order('submitted_at',{ascending:false}).limit(100)]);if(results[0].error){document.getElementById('interpreter-list').innerHTML='<p class="rounded-xl bg-amber-50 p-4 text-sm text-amber-800">Data interpreter belum tersedia. Jalankan schema Supabase.</p>'}else renderInterpreter(results[0].data||[]);if(results[1].error){document.getElementById('student-list').innerHTML='<p class="rounded-xl bg-amber-50 p-4 text-sm text-amber-800">Tabel kartu siswa belum tersedia. Jalankan <code>supabase/student-card-schema.sql</code>.</p>'}else renderStudents(results[1].data||[])}document.querySelectorAll('[data-tab]').forEach(function(tab){tab.onclick=function(){document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('active',x===tab)});document.getElementById('interpreter-list').classList.toggle('hidden',tab.dataset.tab!=='interpreter');document.getElementById('student-list').classList.toggle('hidden',tab.dataset.tab!=='students')}});document.getElementById('refresh').onclick=load;document.getElementById('login').onsubmit=async function(event){event.preventDefault();var result=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(result.error){var box=document.getElementById('login-error');box.textContent='Login gagal.';box.classList.remove('hidden');return}document.getElementById('auth').style.display='none';load()};sb.auth.getSession().then(function(result){if(result.data.session){document.getElementById('auth').style.display='none';load()}})}());
