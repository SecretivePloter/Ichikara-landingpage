<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Teks Career | PT. Ichikara</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif}.field{width:100%;border:1px solid #d1d5db;border-radius:.75rem;padding:.75rem}.field:focus{outline:0;border-color:#b02d21;box-shadow:0 0 0 3px rgba(176,45,33,.1)}</style></head>
