<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>受講生情報登録 | PT. Ichikara</title><link rel="icon" type="image/png" href="../images/favicon-32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms"></script><script src="../js/tailwind-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../js/site-data.js"></script><link rel="stylesheet" href="../css/style.css"><style>body{overflow-x:clip}.field{width:100%;border:1px solid #e8e1d6;border-radius:.75rem;padding:.8rem .9rem;background:#fff;color:#1a1a1a;font-size:.9rem}.field:focus{outline:0;border-color:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.1)}.photo-preview{aspect-ratio:1/1;overflow:hidden;background:#eee9e1}.photo-preview img{width:100%;height:100%;object-fit:cover}</style><script async src="https://www.googletagmanager.com/gtag/js?id=G-09ZBCLX32V"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-09ZBCLX32V');</script></head><body data-site-root="../" data-header-light="true" class="bg-surface-container-low text-on-surface font-inter"><div id="site-header"></div><main class="pt-28 pb-20 md:pt-36"><div class="mx-auto max-w-[1080px] px-6"><a href="kursus-bahasa.html" class="inline-flex items-center gap-2 text-sm font-semibold text-on-surface-variant hover:text-secondary"><span class="material-symbols-outlined text-base">arrow_back</span>日本語教育に戻る</a><div class="mt-8 grid gap-8 lg:grid-cols-[minmax(0,1fr)_330px] lg:items-start"><section class="overflow-hidden rounded-2xl border border-border-light bg-white shadow-sm"><div class="border-b border-border-light px-6 py-7 md:px-9"><p class="text-xs font-bold uppercase tracking-label text-secondary">日本語教育</p><h1 class="mt-2 font-noto text-3xl font-bold text-primary">受講生情報を入力</h1><p class="mt-3 max-w-2xl text-sm leading-relaxed text-on-surface-variant">入力内容をPT. Ichikaraの受講生カードExcelに反映し、専用リンクをメールでお送りします。</p></div><form id="student-form" class="p-6 md:p-9" novalidate><label class="sr-only" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><div class="grid gap-5 sm:grid-cols-2"><label class="block text-sm font-semibold">氏名<input name="fullName" class="field mt-2" maxlength="100" autocomplete="name" required></label><label class="block text-sm font-semibold">メールアドレス<input name="email" class="field mt-2" type="email" maxlength="120" autocomplete="email" required></label><label class="block text-sm font-semibold">出生地<input name="placeOfBirth" class="field mt-2" maxlength="80" required></label><label class="block text-sm font-semibold">生年月日<input name="birthDate" class="field mt-2" type="date" required></label><label class="block text-sm font-semibold">電話番号 / WhatsApp<input name="phone" class="field mt-2" maxlength="30" autocomplete="tel" required></label><label class="block text-sm font-semibold">学校名 / 会社名<input name="schoolOrCompany" class="field mt-2" maxlength="160" required></label></div><label class="mt-5 block text-sm font-semibold">住所<textarea name="address" class="field mt-2 min-h-24" maxlength="500" required></textarea></label><label class="mt-5 block text-sm font-semibold">将来の目標<textarea name="aspiration" class="field mt-2 min-h-24" maxlength="300" required></textarea></label><div class="mt-7 grid gap-6 rounded-2xl bg-surface-container-low p-5 sm:grid-cols-[160px_1fr]"><div class="photo-preview rounded-full border-4 border-white shadow-sm"><img id="photo-preview" class="hidden" alt="写真プレビュー"></div><div><h2 class="font-bold text-primary">受講生の写真</h2><p class="mt-2 text-sm leading-relaxed text-on-surface-variant">写真は受講生カードの丸いフレームに配置されます。顔がはっきり分かる写真を使用してください。</p><label class="mt-4 inline-flex cursor-pointer items-center gap-2 rounded-full border border-secondary px-5 py-3 text-sm font-bold text-secondary hover:bg-white"><span class="material-symbols-outlined text-base">add_a_photo</span><input id="photo" name="photo" class="sr-only" type="file" accept="image/jpeg,image/png" required>写真をアップロード</label><p class="mt-3 text-xs text-outline">JPGまたはPNG、最大5MB。</p></div></div><label class="mt-7 flex gap-3 rounded-xl bg-surface-container p-4 text-sm leading-relaxed"><input class="mt-1 h-4 w-4 accent-secondary" name="consent" type="checkbox" required><span>研修運営のためにPT. Ichikaraがこの情報と写真を保管し、受講生カードをメールで送信することに同意します。</span></label><p id="form-error" class="mt-5 hidden rounded-xl bg-error-container p-4 text-sm text-on-error-container" role="alert"></p><div class="mt-8 flex justify-end border-t border-border-light pt-6"><button id="submit" type="submit" class="rounded-full bg-secondary px-6 py-3 text-sm font-bold text-white hover:bg-red-hover disabled:cursor-wait disabled:opacity-60">送信して生徒カードを作成</button></div></form></section><aside class="lg:sticky lg:top-28"><div class="rounded-2xl bg-primary p-7 text-white"><p class="text-xs font-bold uppercase tracking-label text-tertiary-fixed">受講生カード</p><h2 class="mt-3 font-noto text-2xl font-bold">Ichikara公式フォーマット</h2><p class="mt-4 text-sm leading-relaxed text-white/70">PT. IchikaraのExcelマスターをもとに作成します。NIM欄は使用しません。</p></div></aside></div></div></main><div id="site-footer"></div><script src="../js/student-card-apply.js"></script><script src="../js/jp-header-loader.js"></script></body></html>
