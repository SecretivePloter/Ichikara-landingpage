<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Unduh Kartu Data Siswa | PT. Ichikara</title><link rel="icon" type="image/png" href="images/favicon-32.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Serif+JP:wght@700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script src="js/tailwind-config.js"></script></head><body class="grid min-h-screen place-items-center bg-[#f7f4ef] p-6 font-[Inter] text-[#1a1a1a]"><main id="state" class="w-full max-w-lg rounded-2xl border border-[#e8e1d6] bg-white p-8 text-center shadow-sm"><span class="material-symbols-outlined animate-pulse text-4xl text-[#c0392b]">hourglass_top</span><p class="mt-4 text-sm text-gray-500">Menyiapkan kartu data siswa...</p></main><script>(async function(){var state=document.getElementById('state'),token=new URLSearchParams(location.search).get('token');function esc(v){var d=document.createElement('div');d.textContent=v||'';return d.innerHTML}if(!token){state.innerHTML='<span class="material-symbols-outlined text-4xl text-red-600">link_off</span><h1 class="mt-4 font-serif text-2xl font-bold">Tautan tidak lengkap</h1><p class="mt-3 text-sm text-gray-500">Gunakan tautan asli dari email PT. Ichikara.</p>';return}try{var res=await fetch('/api/student-card-access?token='+encodeURIComponent(token),{cache:'no-store'}),data=await res.json();if(!res.ok)throw Error(data.error);state.innerHTML='<span class="material-symbols-outlined text-4xl text-[#c0392b]">table_view</span><h1 class="mt-4 font-serif text-2xl font-bold">Kartu data siap diunduh</h1><p class="mt-3 text-sm leading-relaxed text-gray-500">Halo '+esc(data.fullName)+', file Excel Anda tersedia melalui tautan aman di bawah.</p><a class="mt-7 inline-flex items-center gap-2 rounded-full bg-[#c0392b] px-6 py-3 text-sm font-bold text-white" href="'+data.downloadUrl+'">Unduh kartu data Excel <span class="material-symbols-outlined text-base">download</span></a><p class="mt-5 text-xs text-gray-400">Jangan membagikan tautan ini kepada orang lain.</p>'}catch(error){state.innerHTML='<span class="material-symbols-outlined text-4xl text-red-600">error</span><h1 class="mt-4 font-serif text-2xl font-bold">Kartu data belum dapat diakses</h1><p class="mt-3 text-sm leading-relaxed text-gray-500">'+esc(error.message||'Silakan minta tautan baru kepada PT. Ichikara.')+'</p>'}}())</script></body></html>
